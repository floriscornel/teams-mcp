name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting and formatting
        run: |
          npm run ci

      - name: Run type checking
        run: npm run compile

      - name: Run tests with JUnit output
        run: |
          # Run tests with coverage and generate JUnit XML for Codecov Test Analytics
          npm run test:coverage:ci

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results.xml

      - name: Build
        run: npm run build

      - name: Test production install (no dev dependencies)
        run: |
          npm pack --pack-destination /tmp/pkg
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/pkg/*.tgz
          node node_modules/@floriscornel/teams-mcp/dist/index.js --help
          node node_modules/@floriscornel/teams-mcp/dist/index.js check

      - name: Test CLI functionality
        run: |
          node dist/index.js --help
          node dist/index.js check

      - name: Security audit
        run: npm audit --audit-level moderate
